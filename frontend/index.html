<script>
  /* 저장된 테마를 첫 화면 그리기 전에 적용 (깜빡임 방지). 값 목록은 src/theme/theme.js 와 같아야 함 */
  try { var t = localStorage.getItem('pockethub.theme'); if (t === 'dark' || t === 'pink') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
